/* /ATHENEA:CAPA */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--ink)}
  body{
    font-family:var(--sans);
    color:var(--ivory);
    -webkit-font-smoothing:antialiased;
  }
  .phone{
    position:relative;
    width:100%;max-width:430px;margin:0 auto;
    overflow:hidden;
    background:linear-gradient(180deg,var(--athenea-cosmos) 0%,var(--athenea-cosmos) 30%,var(--athenea-cosmos) 100%);
  }
  canvas{display:block}
  /* capas de profundidad: stars (fondo) → nebula → organismo → HUD → fx */
  #stars{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);z-index:0;will-change:transform}
  #nebula{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);z-index:0;will-change:transform}
  #brain{will-change:transform}
  .layer{position:relative;z-index:1}

  /* ---------- header ---------- */
  header{padding:18px 18px 0;display:grid;grid-template-columns:1fr auto;gap:8px}
  .clock{font-weight:200;font-size:44px;letter-spacing:2px;line-height:1;font-variant-numeric:tabular-nums;color:var(--athenea-marfil)}
  .date{margin-top:6px;font-size:10.5px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase}
  .focus{
    border:1px solid var(--card-edge);border-radius:12px;
    background:var(--card);padding:10px 12px;min-width:150px;
  }
  .focus .k{font-size:8.5px;letter-spacing:1.8px;color:var(--gold);text-transform:uppercase}
  .focus .v{font-size:11px;letter-spacing:.8px;margin:2px 0 8px;text-transform:uppercase}
  .focus-row{display:flex;align-items:center;gap:8px}
  .ring{width:34px;height:34px;flex:none}
  .focus .pct{font-size:12px;font-weight:600;color:var(--gold-hi)}
  .focus hr{border:0;border-top:1px solid rgba(240,180,40,.14);margin:8px 0 6px}
  .focus .plus{font-size:12px}
  .focus .plus b{color:var(--green);font-weight:600}

  /* ---------- brand ---------- */
  .brand{text-align:center;margin-top:-34px;pointer-events:none}
  .brand .mark{width:54px;height:54px;margin:0 auto}
  h1{
    font-family:var(--serif);font-weight:400;
    font-size:34px;letter-spacing:12px;text-indent:12px;
    color:var(--athenea-marfil);margin-top:6px;text-wrap:balance;
  }
  .live{font-family:var(--serif);font-size:15px;letter-spacing:9px;text-indent:9px;color:var(--gold);margin-top:2px}
  .tagline{font-size:10px;letter-spacing:3.2px;color:var(--marfil-atenuado);text-transform:uppercase;margin-top:8px}

  /* ---------- brain hero ---------- */
  .hero{position:relative;height:520px;margin-top:6px}
  #brain{position:absolute;inset:0;width:100%;height:100%}
  .emblem{
    position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    width:86px;height:86px;border-radius:50%;
    background:radial-gradient(circle,var(--athenea-cosmos) 55%,rgba(240,180,40,.12));
    border:2px solid var(--gold);
    box-shadow:0 0 26px rgba(240,180,40,.55),0 0 70px rgba(240,180,40,.25),inset 0 0 18px rgba(240,180,40,.25);
    display:flex;align-items:center;justify-content:center;
  }
  .callout{position:absolute;width:132px;font-size:10px;transition:opacity 8s ease}
  .callout.quiet{opacity:.55}
  .callout.dormida{opacity:.78}
  .callout .ico{
    width:34px;height:34px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid currentColor;background:rgba(6,7,16,.8);
    box-shadow:0 0 12px currentColor;
  }
  .callout .ico svg{width:16px;height:16px}
  .callout{display:flex;gap:8px;align-items:flex-start}
  .callout.gold{color:var(--gold)}
  .callout.viol{color:var(--doctrina-3)}
  .callout .name{font-size:9.5px;font-weight:700;letter-spacing:1.4px;color:var(--ivory);text-transform:uppercase;line-height:1.35}
  .callout .n1{margin-top:3px;color:currentColor;font-variant-numeric:tabular-nums}
  .callout .n1 b{font-size:11px}
  .callout .n2{color:var(--muted);font-variant-numeric:tabular-nums}
  .callout.right{flex-direction:row-reverse;text-align:right}

  /* ---------- scene + cards ---------- */
  .lower{position:relative}
  #scene{position:absolute;inset:0;width:100%;height:100%}
  .cards{position:relative;padding:10px 12px 4px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{
    background:var(--card);border:1px solid var(--card-edge);
    border-radius:14px;padding:12px;backdrop-filter:blur(3px);
  }
  .card h3{font-size:9px;letter-spacing:2px;color:var(--marfil-atenuado);text-transform:uppercase;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;font-size:10px;color:var(--marfil-atenuado)}
  .row .val{color:var(--gold-hi);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:9.5px}
  .row.total{border-top:1px solid rgba(240,180,40,.18);margin-top:6px;padding-top:9px}
  .row.total .val{font-size:16px}
  .more{display:block;margin-top:9px;font-size:8.5px;letter-spacing:1.6px;color:var(--gold);text-transform:uppercase;text-decoration:none}
  .more::after{content:" →"}

  .quote{
    grid-column:1/-1;text-align:center;padding:16px 20px 10px;
    font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.65;
    color:var(--athenea-marfil);text-shadow:0 0 18px rgba(0,0,0,.9);text-wrap:balance;
  }
  .quote .open{color:var(--gold-hi)}
  .quote cite{display:block;margin-top:8px;font-style:normal;font-family:var(--sans);font-size:9px;letter-spacing:3px;color:var(--muted)}

  .kern .row .val{color:var(--doctrina-2)}
  .kern .ico-r{width:20px;height:20px;border:1px solid rgba(240,180,40,.4);border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--gold);font-family:var(--serif)}
  .kern .lbl{flex:1;line-height:1.3}

  .donut-wrap{display:flex;gap:10px;align-items:center}
  .legend{flex:1;font-size:9.5px}
  .legend .row{padding:2.5px 0}
  .legend .sw{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;flex:none}
  .legend .lab{display:flex;align-items:center;flex:1;color:var(--marfil-atenuado)}
  .legend .val{color:var(--athenea-marfil);font-weight:500}

  .estado{text-align:center}
  .gauge{position:relative;width:104px;height:104px;margin:4px auto}
  .gauge .pct{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:16px;font-size:17px;font-weight:600;color:var(--gold-hi);font-variant-numeric:tabular-nums}
  .estado .status{margin-top:8px;font-size:9.5px;letter-spacing:2.4px;color:var(--green);text-transform:uppercase}

  /* ---------- interactividad táctil ---------- */
  #fx{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
  .card{transition:transform .12s ease}
  .card:active{transform:scale(.975)}
  @keyframes popA{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
  .callout .ico{transition:transform .15s}
  .callout.pop .ico{animation:popA .45s ease}
  .emblem{cursor:pointer;-webkit-tap-highlight-color:transparent;filter:brightness(var(--lum,1))}
  .dock .home{filter:brightness(var(--lum,1))}
  .emblem.ping::after{content:"";position:absolute;inset:-3px;border-radius:50%;
    border:2px solid var(--gold-hi);animation:ringout .7s ease-out forwards}
  @keyframes ringout{to{transform:scale(2.2);opacity:0}}
  @keyframes spinA{to{transform:rotate(360deg)}}
  .dock a{-webkit-tap-highlight-color:transparent;transition:transform .12s}
  .dock a:active{transform:scale(.88)}
  .dock a.spin>svg{animation:spinA 1s linear infinite}

  /* ---------- panel de ajustes: temas + sincronización ---------- */
  .sheet{
    position:absolute;left:12px;right:12px;bottom:110px;z-index:8;
    background:rgba(9,10,22,.96);border:1px solid var(--card-edge);
    border-radius:18px;padding:14px;backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transform:translateY(14px);
    transition:opacity .22s ease,transform .26s cubic-bezier(.2,.9,.3,1.2);
  }
  .sheet.open{opacity:1;pointer-events:auto;transform:translateY(0)}
  .sheet h4{font-size:9px;letter-spacing:2px;color:var(--marfil-atenuado);text-transform:uppercase;margin-bottom:10px}
  .sheet .temas{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
  .sheet .tema{
    display:flex;align-items:center;gap:8px;padding:8px 10px;
    border:1px solid rgba(240,180,40,.14);border-radius:10px;
    background:rgba(255,255,255,.02);cursor:pointer;
    font-size:10px;color:var(--marfil-atenuado);-webkit-tap-highlight-color:transparent;
  }
  .sheet .tema.on{border-color:var(--gold);color:var(--gold-hi)}
  .sheet .tema .dots{display:flex;gap:3px;flex:none}
  .sheet .tema .dots i{width:9px;height:9px;border-radius:50%;display:block}
  .sheet .accion{
    margin-top:11px;width:100%;padding:9px;border:1px solid var(--card-edge);
    border-radius:10px;background:rgba(240,180,40,.08);color:var(--gold);
    font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;cursor:pointer;
    font-family:var(--sans);-webkit-tap-highlight-color:transparent;
  }

  /* ---------- footer ---------- */
  .sync{display:flex;align-items:center;justify-content:center;gap:9px;padding:16px 14px 12px;
    font-size:9.5px;letter-spacing:3px;color:var(--marfil-atenuado);text-transform:uppercase;text-align:center;
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  .sync .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex:none}
  .sync.busy .dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .sync.err .dot{background:var(--rojo);box-shadow:var(--luz-estado)}

  /* ---------- modo pantalla: todo en una sola pantalla de celular ---------- */
  body.compact .phone{--gapH:118px;min-height:100vh}
  body.compact header{padding:14px 16px 0}
  body.compact .clock{font-size:38px}
  body.compact .focus{padding:8px 10px;min-width:138px}
  body.compact .brand{margin-top:-28px}
  body.compact .brand .mark{width:44px;height:44px}
  body.compact h1{font-size:27px;letter-spacing:10px;text-indent:10px;margin-top:4px}
  body.compact .live{font-size:12px}
  body.compact .tagline{font-size:9px;margin-top:5px;letter-spacing:2.6px}
  body.compact .hero{height:392px;margin-top:2px}
  body.compact .emblem{width:74px;height:74px}
  body.compact .cards{padding:4px 12px 0}
  body.compact .cards .card{display:none}
  body.compact .quote{padding:8px 18px 4px;font-size:12.5px}
  body.compact .sync{padding:8px 14px 6px}
  /* en el celular, el dock sube para dejar libre la fila de favoritos del launcher */
  body.compact .dock{margin:0 12px 148px;padding:10px 6px 8px}

  /* ---------- modo panorama (laptop/monitor): el cosmos cubre TODO ---------- */

/* ---------- reloj y fecha en vivo ---------- */
function tick(){
  const d = new Date();
  document.getElementById("clock").textContent =
    String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  const dias = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  document.getElementById("date").textContent =
    `${dias[d.getDay()]}, ${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()}`;
}
tick(); setInterval(tick, 15000);

/* ── Cognición: el estado de la inteligencia que el organismo representa.
      Se lee del conocimiento real (DATA de la rutina diaria / sync en vivo).
      No sustituye a la homeostasis: la CAUSA. ── */
const Cog={mass:0,flow:0,connectivity:0,novelty:0,stability:0,focus:0,entropy:0};
function senseKnowledge(liveTotal,liveHoy,liveMod,liveSemana,counts){
  const num=v=>parseInt(String(v).replace(/[^0-9]/g,""))||0;
  const cl=(v,a,b)=>v<a?a:v>b?b:v;
  const total=liveTotal!=null?liveTotal:num((DATA.resumen[0]||{}).v);
  const hoy=liveHoy!=null?liveHoy:num((DATA.actividadHoy[0]||{}).v);
  const mo=liveMod!=null?liveMod:num((DATA.actividadHoy[1]||{}).v);
  const sem=liveSemana!=null?liveSemana:num((DATA.actividadHoy[2]||{}).v);
  const conn=num((DATA.resumen[1]||{}).v);
  const ws=counts?Object.values(counts):DATA.areas.map(a=>a.notas);
  let tot=0,h=0; for(const w of ws) tot+=w;
  for(const w of ws){ const p2=tot?w/tot:0; h+=p2*p2; }
  Cog.mass=cl(total/1000,0,1);                 // masa real de conocimiento
  Cog.flow=cl((hoy+mo)/30,0,1);                // solo cambios reales de hoy (sin cambios → 0)
  // conectividad: SOLO del grafo real; sin grafo, null — jamás estimada
  const gr=DATA.grafo;
  Cog.connectivity=(gr&&gr.enlaces!=null&&gr.notasEscaneadas>0)
    ? cl((gr.enlaces/gr.notasEscaneadas)/8,0,1) : null;
  // novedad: crecimiento real entre censos cuando hay historia; si no, lo creado esta semana
  const hist=DATA.historial||[];
  Cog.novelty=hist.length>=2
    ? cl((hist[hist.length-1].total-hist[hist.length-2].total)/Math.max(1,hist[hist.length-1].total),0,1)
    : cl(total?sem/total:0,0,1);
  Cog.focus=cl((h-1/8)/(1-1/8),0,1);           // concentración por áreas
  Cog.entropy=1-Cog.focus;                     // dispersión
  Cog.stability=cl(1-0.7*Cog.novelty-0.3*Cog.flow,0,1); // lo asentado
}
senseKnowledge();

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* La firma respiratoria de ATHENEA: inhalación honda, breve liberación,
   una segunda cresta corta —como quien comprende algo— y exhalación larga. */
function breathShape(p){
  if(p<0.40){ const q=p/0.40; return q*q*(3-2*q); }
  if(p<0.52) return 1-0.12*Math.sin((p-0.40)/0.12*Math.PI);
  if(p<0.64) return 0.88+0.10*Math.sin((p-0.52)/0.12*Math.PI);
  const q=(p-0.64)/0.36; return 0.88*(1-q*q*(3-2*q));
}

function setupCanvas(cv,maxDpr){
  const dpr=Math.min(window.devicePixelRatio||1,maxDpr||2);
  const r=cv.getBoundingClientRect();
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  const g=cv.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  return [g,r.width,r.height];
}
function makeLayer(w,h){
  const c=document.createElement("canvas");

}

/* ---------- Noise: ruido de valor determinista ---------- */
const Noise=(()=>{
  const p=new Uint8Array(512), rnd=mulberry32(1234);
  for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0, t=p[i];p[i]=p[j];p[j]=t;}
  for(let i=0;i<256;i++)p[256+i]=p[i];
  const fade=t=>t*t*(3-2*t);
  function n2(x,y){
    const X=Math.floor(x),Y=Math.floor(y);
    const xf=x-X,yf=y-Y,u=fade(xf),v=fade(yf);
    const a=p[(p[X&255]+Y)&255],b=p[(p[(X+1)&255]+Y)&255],
          c=p[(p[X&255]+Y+1)&255],d=p[(p[(X+1)&255]+Y+1)&255];
    return (lerp(lerp(a,b,u),lerp(c,d,u),v)/127.5)-1;
  }
  return {n2, n1:x=>n2(x,7.31)};
})();

  const tok = (n, alt) => (cs.getPropertyValue(n).trim() || alt || "");
  const rgb = (h) => { const s=h.replace("#","");
    const b=parseInt(s.length===3?s.split("").map(c=>c+c).join(""):s,16);
    return `${b>>16&255},${b>>8&255},${b&255}`; };
  /* Sin valores de reserva: un fallback es una copia del token y miente el día
     que la identidad cambia. Si la capa no está, se dice. */
  const oro = tok("--athenea-practica");
  const vio = tok("--athenea-doctrina");
  if (!oro || !vio) console.error("ATHENEA: falta la capa de tokens.");
  const mezclar = (a,b,p) => { const h=x=>{const s=x.replace("#","");
      const n=parseInt(s.length===3?s.split("").map(c=>c+c).join(""):s,16);
      return [n>>16&255,n>>8&255,n&255];};
    const A=h(a),B=h(b);
    return "#"+A.map((v,i)=>Math.round(v*(1-p)+B[i]*p).toString(16).padStart(2,"0")).join("");};
  return {
    L: { a: rgb(oro), b: "224,170,60",  glow: oro },
    R: { a: rgb(vio), b: "110,80,230",  glow: mezclar(vio, tok("--athenea-marfil"), 0.28) },
  };
})();

/* ---------- Core: un solo ticker para todo el organismo ---------- */
const Core={
  running:false, last:0, time:0, subs:[],
  add(fn){ this.subs.push(fn); },
  start(){
    if(this.running||reduceMotion) return;
    this.running=true; this.last=performance.now();
    requestAnimationFrame(Core.frame);
  },
  stop(){ this.running=false; },
  ema:0.016, slow:false, quality:2, qCap:2, _qb:0, _qg:0,
  frame(now){
    if(!Core.running) return;
    const dt=clamp((now-Core.last)/1000,0.001,0.05);
    Core.last=now; Core.time+=dt;
    Core.ema=Core.ema*0.95+dt*0.05;
    // gobernador adaptativo por niveles: degrada con histéresis, recupera despacio
    if(Core.ema>0.030 && Core.quality>0){ if(++Core._qb>60){ Core.quality--; Core._qb=0; Core._qg=0; } }
    else if(Core.ema<0.018 && Core.quality<Core.qCap){ if(++Core._qg>360){ Core.quality++; Core._qg=0; } }
    else { Core._qb=0; }
    Core.slow=Core.quality<2;
    for(let i=0;i<Core.subs.length;i++) Core.subs[i](dt,Core.time);
    requestAnimationFrame(Core.frame);
  },
};
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ Core.stop(); if(typeof Mind!=="undefined") Mind.rest(); }
  else { Core.start(); if(typeof Mind!=="undefined") Mind.reencounter(); }
});

/* ---------- Mind: la consciencia del organismo (v3) ----------
   Rhythm: osciladores inconmensurables con tiempo deformado por ruido.
   Attention: un punto de interés que toda la escena persigue.
   Curiosity: visitas a las áreas por secuencia áurea, jamás periódicas.
   Emotion: estados con histéresis; toda transición es un fundido.
   Ambient: quietud → contemplación; interacción → despertar; datos → absorción.
   Demo: en reposo prolongado, un recorrido lento de sí misma; un toque lo cancela. */
const Mind=(()=>{
  const RHY={breath:{T:5.6,warp:0.22,ph:0.0},pulse:{T:1.7,warp:0.22,ph:2.1},
             activity:{T:23,warp:0.5,ph:4.2},rest:{T:47,warp:0.6,ph:1.3}};
  const r={breath:0.5,breathPh:0,pulse:0.5,activity:0.5,rest:0.5,wake:0};
  const att={x:0,y:0,tx:0,ty:0,level:0};
  /* ── Homeostasis: el organismo solo conoce cinco variables internas.
        Todo lo demás —respiración, luz, flujo, deriva, órbitas, cámara—
        se deriva de su equilibrio. life emerge; no se muestra ni se configura. ── */
  const H={energy:0.6, attention:0.2, curiosity:0.4, coherence:0.7, memory:0.5, life:0.5};
  const mod={breath:1,drift:1,flux:1,speed:1,lum:0,orbit:1};
  const intg=[];   // descubrimientos pendientes de integrarse en la memoria
  let lastTouch=0,lastMotion=0,lastData=-999,bigDay=false;   // nace en calma; el sueño se gana con quietud real
  let curSeq=0.37, curHold=0;
  let demoStep=-1, demoT=0;
  let sigh=0, breathAmp=1, wakeT=9, pendTouch=null, lastAct=0, hiddenAt=-1;
  /* ── El Mundo: el organismo percibe señales reales; ninguna es un temporizador ── */
  const world={phase:"dia", prevPhase:"dia", batt:1, charging:false, saver:false, motion:0};
  function senseWorld(){
    const nowD=new Date(), hr=nowD.getHours()+nowD.getMinutes()/60;
    world.prevPhase=world.phase;
    world.phase=(hr<5.5||hr>=19.5)?"noche":hr<8?"amanecer":hr<17.5?"dia":"atardecer";
    if(world.prevPhase==="noche"&&world.phase==="amanecer"){ wakeT=0; sigh=Math.max(sigh,1); } // sale el sol: despierta despacio
  }
  /* ── Propósito: ATHENEA solo actúa por uno de cinco impulsos ── */
  let impulse="descansar", impT=0, sideDebt=0;
  function dataShares(){
    const em=Particles.peekEmitters();
    let tot=0,max=0,domSide=0;
    for(const e of em){ tot+=e.w; if(e.w>max){max=e.w;domSide=e.side;} }
    return {tot,domShare:tot?max/tot:0,domSide};
  }
  function pickImpulse(t){
    if(t-lastData<45)      return "crecer";      // entró energía: expandirse es consecuencia
    if(H.coherence<0.45)   return "conectar";    // desequilibrio interno: reorganizarse
    if(H.curiosity>0.6 && H.attention>0.25) return "comprender";
    if(H.memory>0.6 && H.attention<0.2)     return "conservar";
    return "descansar";
  }

  function notice(kind,a,b){
    const t=Core.time;
    if(kind==="touch"){
      const prev=lastTouch; lastTouch=t;
      H.energy=clamp(H.energy-0.03,0.1,1);          // atender cuesta
      H.curiosity=clamp(H.curiosity-0.05,0,1);      // el mundo respondió: menos incógnita
      if(t-prev>120){ sigh=Math.max(sigh,0.8); pendTouch={x:a,y:b,at:t+0.9}; } // reencuentro
      else { att.tx=a; att.ty=b; att.level=Math.min(1,att.level+0.8); }
    }
    else if(kind==="motion"){ lastMotion=t; world.motion=Math.min(1,world.motion+0.2); }
    else if(kind==="hallazgo"){ H.curiosity=Math.max(H.curiosity,0.6); sigh=Math.max(sigh,0.7);
      Organism.momentFugaz();                                  // comprendió algo: llega su estrella
    }
    else if(kind==="confirmacion"){ H.coherence=clamp(H.coherence+0.08,0,1); Light.boost(0.12); // sobrevivió a la refutación: certeza serena
      Organism.momentFugaz();
    }
    else if(kind==="data"){ lastData=t; att.tx=Organism.cx; att.ty=Organism.cy;
      att.level=Math.min(1,att.level+0.6); bigDay=a===true;
      H.energy=clamp(H.energy+(bigDay?0.35:0.2),0,1);          // el conocimiento alimenta
      H.curiosity=clamp(H.curiosity+0.15,0,1);
      H.memory=clamp(H.memory+0.02,0,1);
      // entró información: una estrella por lado, y una tercera si el día fue
      // grande. No una por nota — veinte notas no son veinte estrellas, son un
      // día grande, y eso se dice con una más, no con veinte.
      Organism.momentFugaz(0); Organism.momentFugaz(1);
      if(bigDay) Organism.momentFugaz();
    }
  }
  function heroTop(){ const h=document.querySelector(".hero"); return h?h.offsetTop:0; }
  function curiosityVisit(t,side){
    curSeq=(curSeq+0.6180339887)%1;
    let em=Particles.peekEmitters();
    if(side===0||side===1) em=em.filter(e=>e.side===side);
    if(em&&em.length){
      const e=em[Math.floor(curSeq*em.length)%em.length];
      att.tx=e.x; att.ty=e.y-heroTop();
      att.level=Math.max(att.level,0.55);
      Interaction.softWave(e.x,e.y,0.28);
      curHold=6;
    }
  }
  function stateLabel(t){   // lectura, no máquina: la emoción emerge del equilibrio
    if(bigDay && t-lastData<20) return "celebrating";
    if(t-lastData<12)           return "inspired";
    if(H.attention>0.5)         return "focused";
    if(H.energy<0.35)           return "dormant";
    if(H.curiosity>0.65)        return "curious";
    if(impulse==="conservar")   return "calm";
    return impulse==="conectar"?"thinking":"calm";
  }
  function runDemo(dt,t){
    demoT+=dt;
    const step=Math.floor(demoT/5);
    if(step>=9){ demoStep=-1; return; }
    if(step!==demoStep){
      demoStep=step;
      if(step<8) curiosityVisit(t);
      else { att.tx=Organism.cx; att.ty=Organism.cy; att.level=0.8; Light.boost(0.25); }
    }
  }
  function update(dt,t){
    for(const k in RHY){
      const o=RHY[k], baseT=(k==="breath"?THEME.breath:o.T)*mod.breath;
      const tw=t+Noise.n1(t*0.06+o.ph)*baseT*o.warp;   // tiempo deformado: nunca periódico
      if(k==="breath"){
        const pph=((tw/baseT)%1+1)%1;
        r.breathPh=pph; r.breath=breathShape(pph);
      } else r[k]=0.5+0.5*Math.sin(tw*2*Math.PI/baseT+o.ph);
    }
    // respiración inteligente: la amplitud vive; ninguna respiración es igual a otra
    const ampT=(0.86+0.14*(0.5+0.5*Noise.n1(t*0.013))+sigh*0.15)*(0.90+0.20*H.life);
    breathAmp=lerp(breathAmp,ampT,1-Math.exp(-dt*0.7));
    r.breath=clamp(r.breath*breathAmp,0,1.05);
    sigh*=Math.exp(-dt*0.45);
    wakeT+=dt; r.wake=Math.sin(clamp(wakeT/1.8,0,1)*Math.PI);
    if(pendTouch&&t>pendTouch.at){
      att.tx=pendTouch.x; att.ty=pendTouch.y;
      att.level=Math.min(1,att.level+0.8); pendTouch=null;
    }
    if(audioOn&&audioAn){   // el sonido ambiente respira con el organismo
      audioAn.getByteFrequencyData(audioData);
      let sum=0; for(let i=2;i<24;i++) sum+=audioData[i];
      audioLvl=lerp(audioLvl,sum/22/255,0.08);
    } else audioLvl*=0.98;
    att.x=lerp(att.x,att.tx,1-Math.exp(-dt*3));
    att.y=lerp(att.y,att.ty,1-Math.exp(-dt*3));
    att.level*=Math.exp(-dt*0.35);
    if(att.level<0.14){   // la mirada reposa cerca del centro cognitivo real (área dominante)
      const domX=Organism.cx+(dataShares().domSide===0?-1:1)*Organism.R*0.28;
      att.tx=domX+Noise.n1(t*0.03)*Organism.R*0.40;
      att.ty=Organism.cy+Noise.n1(t*0.027+5)*Organism.R*0.40;
      att.level=Math.max(att.level,0.12);
    }
    if(curHold>0) curHold-=dt;
    const idle=t-lastTouch;
    if(idle>90&&demoStep<0&&H.curiosity>0.8){                          // la curiosidad acumulada desborda: recorrido
      demoStep=0; demoT=0; H.curiosity=clamp(H.curiosity-0.4,0,1);
    }
    if(demoStep>=0){ if(idle<1) demoStep=-1; else runDemo(dt,t); }
    /* ── homeostasis: cada variable busca su punto de equilibrio, y el mundo lo mueve ── */
    senseWorld();
    world.motion*=Math.exp(-dt*0.8);
    H.attention=lerp(H.attention,att.level,1-Math.exp(-dt*1.5));
    const eSet=(world.phase==="noche"?0.45:world.phase==="amanecer"?0.80:world.phase==="atardecer"?0.60:0.72)
              *((world.batt<0.25&&!world.charging)?0.65:1)*(world.saver?0.7:1)
              *(0.9+0.3*Cog.flow);              // el conocimiento entrando eleva el punto vital
    H.energy+=dt*0.010*(eSet-H.energy)*(world.charging?2.4:1);
    H.curiosity=clamp(H.curiosity+dt*0.005*H.energy
              *(0.6+0.8*Cog.novelty)            // lo nuevo engendra curiosidad
              *((world.batt<0.25&&!world.charging)?0.3:1),0,1);
    H.memory+=dt*0.004*((0.30+0.60*Cog.mass)-H.memory);   // la memoria ES la masa de conocimiento
    sideDebt=clamp(sideDebt+dt*(att.x<Organism.cx?1:-1),-90,90);
    H.coherence=clamp(H.coherence+dt*0.006*(0.5+Cog.stability) // lo asentado se ordena solo…
      -dt*0.004*Cog.entropy                                 // …la dispersión del saber lo erosiona…
      -dt*0.0012*Math.abs(sideDebt)                        // …la atención desequilibrada lo erosiona…
      -dt*0.010*world.motion                                // …el andar lo agita…
      -dt*0.02*Math.min(1,Interaction.turbulence()),0,1);  // …y la turbulencia también
    while(intg.length&&t>intg[0]){                          // lo descubierto se integra: memoria
      intg.shift();
      H.memory=clamp(H.memory+0.012,0,1);
      H.coherence=clamp(H.coherence+0.02,0,1);
    }
    H.life=lerp(H.life,
      Math.pow(Math.max(0.02,H.energy*Math.max(H.attention,0.25)*H.curiosity*H.coherence*H.memory),0.2),
      1-Math.exp(-dt*0.4));   // media geométrica: la vida emerge del equilibrio, no de un botón
    /* el equilibrio se expresa: todo modificador deriva de las cinco variables */
    const k2=1-Math.exp(-dt*0.8);
    mod.breath=lerp(mod.breath,(1.45-0.75*H.energy)*(world.phase==="noche"?1.15:world.phase==="amanecer"?0.92:1),k2);
    mod.drift =lerp(mod.drift, (0.5+0.9*H.energy)*(1.15-0.35*H.memory)*(H.coherence<0.5?1.12:1), k2);
    mod.flux  =lerp(mod.flux,  clamp((0.4+1.3*H.energy)*(0.7+0.6*H.curiosity)*(0.6+0.8*H.life),0.2,2.2), k2);
    mod.speed =lerp(mod.speed, 0.6+0.8*H.energy, k2);
    mod.lum   =lerp(mod.lum,   0.16*(H.life-0.5)+0.05*H.memory, k2);
    mod.orbit =lerp(mod.orbit, 0.4+1.0*H.curiosity, k2);
    if(t-impT>5){ impulse=pickImpulse(t); impT=t; }
    /* toda acción nace de una presión interna que cruza su umbral — nunca de un reloj */
    if(t-lastAct>8 && t-lastTouch>6){
      if(t-lastData<45 && H.energy>0.35 && H.curiosity>0.3){          // entró conocimiento: crecer
        if(Organism.discover(t)){
          H.energy-=0.05; H.curiosity=clamp(H.curiosity-0.12,0,1);
          H.coherence=clamp(H.coherence-0.06,0,1); intg.push(t+30);   // lo nuevo desordena hasta integrarse
          sigh=Math.max(sigh,0.5); lastAct=t;
        }
      } else if(H.coherence<0.45){                                     // desequilibrio: conectar
        const side=sideDebt>0?1:0;
        if(Organism.discover(t,side)) intg.push(t+30);
        curiosityVisit(t,side); sideDebt*=0.4;
        H.coherence=clamp(H.coherence+0.06,0,1); H.energy-=0.04; lastAct=t;
      } else if(H.curiosity>0.62 && H.attention>0.08){                 // la curiosidad desborda: comprender
        curSeq=(curSeq+0.6180339887)%1;
        if(curSeq<0.5) Organism.momentLink(t,dataShares().domSide);
        else curiosityVisit(t);
        H.curiosity=clamp(H.curiosity-0.10,0,1);
        H.coherence=clamp(H.coherence+0.05,0,1); lastAct=t;
      } else if(H.memory>0.6 && H.coherence<0.85 && H.attention<0.15){ // hay mucho valioso: conservar
        Organism.momentOrbit();
        H.coherence=clamp(H.coherence+0.08,0,1); H.energy-=0.02; lastAct=t;
      }
      /* si ninguna presión cruza su umbral: descansar ES el comportamiento */
    }
    state=stateLabel(t);
    if(bigDay&&t-lastData>20) bigDay=false;
  }
  return {r,att,mod,notice,update,
    get state(){return state}, get impulse(){return impulse},
    get vitals(){return H;}, get world(){return world;},
    senseBattery(l,c){ world.batt=l; world.charging=c; },
    rest(){ hiddenAt=Date.now(); },
    reencounter(){
      if(hiddenAt>0){   // mientras no estabas, descansó
        const away=(Date.now()-hiddenAt)/1000;
        H.energy=clamp(H.energy+Math.min(0.15,away/1200*0.15),0,1);
        hiddenAt=-1;
      }
      wakeT=0; sigh=Math.max(sigh,1);
    }};
})();

/* ---------- Camera: parallax sutil (puntero + giroscopio) ---------- */
const Camera={
  tx:0,ty:0,x:0,y:0,_els:null,
  init(){
    this._els={
      stars:document.getElementById("stars"),
      nebula:document.getElementById("nebula"),
      brain:document.getElementById("brain"),
    };
    addEventListener("pointermove",e=>{
      Camera.tx=clamp(e.clientX/innerWidth-0.5,-0.5,0.5)*2;
      Camera.ty=clamp(e.clientY/innerHeight-0.5,-0.5,0.5)*2;
    },{passive:true});
    addEventListener("deviceorientation",e=>{
      if(e.gamma==null||e.beta==null) return;
      Camera.tx=clamp(e.gamma/28,-1,1);
      Camera.ty=clamp((e.beta-45)/32,-1,1);
    },true);
    addEventListener("devicemotion",e=>{
      const a=e.acceleration; if(!a||a.x==null) return;
      const mag=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);
      if(mag>1.8) Mind.notice("motion",mag);
    },true);
  },
  update(dt){
    const k=1-Math.exp(-dt*2.2), t=Core.time;
    this.x=lerp(this.x,this.tx,k); this.y=lerp(this.y,this.ty,k);
    const e=this._els; if(!e) return;
    const orb=Mind.mod.orbit;
    const ox=Noise.n1(t*0.05)*1.6*orb, oy=Noise.n1(t*0.045+9)*1.3*orb;
    const ax=Mind.att.level>0.05?(Mind.att.x-Organism.cx)*0.012*Mind.att.level:0;
    const ay=Mind.att.level>0.05?(Mind.att.y-Organism.cy)*0.010*Mind.att.level:0;
    const zoom=(1+0.004*(Mind.r.breath-0.5)*2).toFixed(4);
    e.stars.style.transform=`translate(${(-this.x*5-ox*0.5).toFixed(1)}px,${(-this.y*4-oy*0.5).toFixed(1)}px)`;
    e.nebula.style.transform=`translate(${(-this.x*9-ox).toFixed(1)}px,${(-this.y*7-oy).toFixed(1)}px)`;
    e.brain.style.transform=`translate(${(this.x*2.5+ox+ax).toFixed(1)}px,${(this.y*2+oy+ay).toFixed(1)}px) scale(${zoom})`;
  },
};

/* ---------- Organism: el cerebro como sistema vivo ---------- */
const Organism=(()=>{
  let g=null,W=0,H=0,cx=0,cy=0,R=0;
  let n=0, bx=null,by=null,px=null,py=null,vx=null,vy=null,ph=null,sz=null,sd=null,tx=null,ty=null;
  let nd=null,nxr=null;   // distancia al núcleo y posición horizontal normalizadas
  let ux=null,uy=null,uz=null,prof=null;   // ESFERA: coordenadas en la esfera unidad y profundidad
  let ang=0;                               // giro acumulado
  let anclas=[];                           // conectores etiqueta → nodo, ahora dinámicos
  const FOCO=3.1;                          // distancia focal, en radios
  const VUELTA=120;                        // segundos por vuelta. Lento a propósito (Ley 6)
  let altBit=0;
  let links=null,nLinks=0;            // [i,j,alpha*100] aplanado
  let rootsC=null, rootLine=null;     // cache estático + polilínea central
  let mem=null,mg=null,mw=0,mh=0,memTick=0;   // membrana volumétrica (materia, no líneas)
  let cand=[],disc=[],liveLink=-1,liveT0=0,mlSeq=0.29,dSeq=0.53,orbSeq=0.71;
  const ringPhase=[0,2.1,4.2],ringVel=[1,-1,1],ringVelT=[1,-1,1];
  let sprS=[null,null],sprM=[null,null],sprL=[null,null],halo=[null,null],aura=null;
  let haloR=0;

  /* ---- LA ESFERA -------------------------------------------------------
     Sustituye a inside(), que recortaba dos lóbulos planos. Ver el estudio en
     ATHENEA-Product/07-Brand/ESTUDIO_NUCLEO_CONSTELACION.md.

     Lo que NO cambia, y es lo único que importaba: el hemisferio izquierdo es
     práctica (oro) y el derecho doctrina (violeta). Una esfera tiene mitad
     izquierda y mitad derecha, así que el par sigue siendo estructura. */

  /* Campo de densidad: suma de senos con frecuencias que no encajan entre sí.
     De aquí salen los grumos y los vacíos — sin esto la esfera es un alambre. */
  function densidad3(x,y,z){
    const v=Math.sin(x*3.1+y*1.7+z*2.3)*0.50
           +Math.sin(x*5.7-y*4.1+z*1.3)*0.30
           +Math.sin(-x*2.2+y*6.3+z*5.1)*0.20;
    return (v+1)/2;
  }

  /* Muestreo uniforme dentro de un casquete alrededor de un eje unitario. */
  function enCasquete(ex,ey,ez,alfa,rnd){
    const cosA=Math.cos(alfa);
    const u=cosA+(1-cosA)*rnd();
    const s=Math.sqrt(Math.max(0,1-u*u));
    const fi=rnd()*Math.PI*2;
    const ax=Math.abs(ex)<0.8?1:0, ay=Math.abs(ex)<0.8?0:1;
    let b1x=ay*ez, b1y=-ax*ez, b1z=ax*ey-ay*ex;
    const n1=Math.hypot(b1x,b1y,b1z)||1; b1x/=n1; b1y/=n1; b1z/=n1;
    const b2x=ey*b1z-ez*b1y, b2y=ez*b1x-ex*b1z, b2z=ex*b1y-ey*b1x;
    const c=Math.cos(fi)*s, d=Math.sin(fi)*s;
    return [ex*u+b1x*c+b2x*d, ey*u+b1y*c+b2y*d, ez*u+b1z*c+b2z*d];
  }

  /* EL PESO DEL CONOCIMIENTO. Cada área ocupa un casquete proporcional a sus
     notas, y la latitud la reparte simétricamente en los dos lados, en el
     MISMO orden que las columnas de la pantalla.

     La proporción es raíz cuadrada, y queda declarado por qué: en crudo «Otras
     Áreas» llega a ser cientos de veces «Derecho Internacional», y a escala
     lineal borraría a las demás. Con raíz el orden se conserva y la diferencia
     se ve. El casquete crece con el número de puntos, así que la densidad es
     la misma en todas y lo que varía es cuánta esfera ocupa cada una. */
  function repartoAreas(){
    const A=(typeof DATA!=="undefined"&&DATA&&DATA.areas)?DATA.areas:null;
    const arm=(lista,lado)=>{
      const k=lista.length||1;
      return lista.map((a,i)=>({
        lado, peso:Math.sqrt(Math.max(1,a&&a.notas!=null?a.notas:1)),
        lat:-0.78+1.56*((i+0.5)/k)
      }));
    };
    if(!A||!A.length){
      const v=[{},{},{},{}];
      return arm(v,-1).concat(arm(v,1));
    }
    return arm(A.filter(a=>a.side==="L"),-1).concat(arm(A.filter(a=>a.side==="R"),1));
  }

  /* De la esfera a la pantalla. El hemisferio NO se recalcula aquí: sd es del
     nodo, no de la vista — si girase con la cámara, el oro pasaría a la derecha
     y el violeta a la izquierda, que es justo lo que la norma prohíbe. */
  function proyectar(){
    const cs=Math.cos(ang), sn=Math.sin(ang);
    for(let i=0;i<n;i++){
      const X= ux[i]*cs+uz[i]*sn;
      const Z=-ux[i]*sn+uz[i]*cs;
      const k=FOCO/(FOCO-Z);
      bx[i]=cx+X*R*k; by[i]=cy+uy[i]*R*k;
      prof[i]=(Z+1)/2;
      nxr[i]=(X+1)/2;            // meridiano: la luz que recorre, en pantalla
    }
  }

  function rebuild(){
    const cv=document.getElementById("brain");
    [g,W,H]=setupCanvas(cv,1.5);
    cx=W/2; cy=H*0.44; R=Math.min(W*0.36,H*0.40);
    const rnd=mulberry32(42);
    const dens=0.75+0.5*Cog.mass;               // más conocimiento → organismo más denso
    const nTot=Math.round(390*dens);

    // reparto por área, y dentro de cada área un casquete de la esfera
    const areas=repartoAreas();
    let sumaPeso=0; for(const a of areas) sumaPeso+=a.peso;
    const UX=[],UY=[],UZ=[],SD=[],SZ=[],PH=[];
    for(const a of areas){
      a.cuota=a.peso/sumaPeso;
      a.cupo=Math.max(6,Math.round(nTot*a.cuota));
      a.alfa=Math.acos(Math.max(-1,1-2*a.cuota*0.92));
      const rr=Math.sqrt(Math.max(0,1-a.lat*a.lat));
      const giro=(a.lat>0?1:-1)*0.42;
      const ex=a.lado*Math.cos(giro)*rr, ey=a.lat, ez=Math.sin(giro)*rr;
      let puestos=0;
      for(let guarda=0; puestos<a.cupo && guarda<a.cupo*30; guarda++){
        const [qx,qy,qz]=enCasquete(ex,ey,ez,a.alfa,rnd);
        // EL MERIDIANO NO SE CRUZA: un nodo de práctica en el lado de doctrina
        // rompe la única regla que no se puede tocar.
        if(Math.sign(qx)!==a.lado && Math.abs(qx)>0.04) continue;
        if(rnd()>0.30+0.60*densidad3(qx*4.6,qy*4.6,qz*4.6)) continue;  // grumos y vacíos
        const dentro=rnd()<0.18;
        const rad=dentro?0.42+rnd()*0.46:0.94+(rnd()-0.5)*0.17;        // espesor
        UX.push(qx*rad); UY.push(qy*rad); UZ.push(qz*rad);
        SD.push(a.lado);
        const s=rnd(); SZ.push(s>.90?2:(s>.58?1:0));
        PH.push(rnd()*9);
        puestos++;
      }
    }

    n=UX.length;
    bx=new Float32Array(n); by=new Float32Array(n);
    px=new Float32Array(n); py=new Float32Array(n);
    vx=new Float32Array(n); vy=new Float32Array(n);
    ph=new Float32Array(n); sz=new Float32Array(n); sd=new Int8Array(n);
    tx=new Float32Array(n); ty=new Float32Array(n);
    ux=new Float32Array(n); uy=new Float32Array(n); uz=new Float32Array(n);
    prof=new Float32Array(n); nd=new Float32Array(n); nxr=new Float32Array(n);
    for(let i=0;i<n;i++){
      ux[i]=UX[i]; uy[i]=UY[i]; uz[i]=UZ[i];
      sd[i]=SD[i]; sz[i]=SZ[i]; ph[i]=PH[i];
      nd[i]=Math.hypot(ux[i],uy[i],uz[i]);       // radio: la respiración viaja del núcleo afuera
    }
    proyectar();                                  // llena bx/by/prof/nxr
    for(let i=0;i<n;i++){ px[i]=tx[i]=bx[i]; py[i]=ty[i]=by[i]; }

    // enlaces: vecinos EN 3D dentro del mismo hemisferio
    const cvw=Cog.connectivity==null?0.5:Cog.connectivity; // sin grafo: neutro simbólico declarado
    const maxD=0.20+0.04*cvw, tmp=[];
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
      if(sd[i]!==sd[j]) continue;
      const d=Math.hypot(ux[i]-ux[j],uy[i]-uy[j],uz[i]-uz[j]);
      if(d<maxD) tmp.push(i,j,Math.round((1-d/maxD)*50));
    }

    /* LOS CRUCES ENTRE DOMINIOS. Se declaran aparte y hay un motivo medido: al
       repartir cada área en su casquete, la malla de vecinos deja casi ninguna
       arista cruzando el meridiano — y VISUAL_IDENTITY §59 dice que esas
       conexiones «son visualmente preciosas». Sin ellas hay dos hemisferios y
       ningún diálogo, que es lo contrario de lo que la imagen significa.
       Se reparten por franjas de latitud: tomados solo por cercanía salían
       amontonados y se leían como un manojo de cuerdas paralelas. */
    const cercaL=[],cercaR=[];
    for(let i=0;i<n;i++) (sd[i]<0?cercaL:cercaR).push([Math.abs(ux[i]),i]);
    cercaL.sort((a,b)=>a[0]-b[0]); cercaR.sort((a,b)=>a[0]-b[0]);
    const cab=(v)=>v.slice(0,44).map(q=>q[1]);
    const pares=[];
    for(const i of cab(cercaL)) for(const j of cab(cercaR))
      pares.push([(uy[i]-uy[j])**2+(uz[i]-uz[j])**2,i,j]);
    pares.sort((a,b)=>a[0]-b[0]);
    const usado=new Set(), franjas=new Map(); let cruces=0;
    for(const [,i,j] of pares){
      if(usado.has(i)||usado.has(j)) continue;
      const fr=Math.round((uy[i]+uy[j])/2*3.5);
      if((franjas.get(fr)||0)>=2) continue;
      franjas.set(fr,(franjas.get(fr)||0)+1);
      usado.add(i); usado.add(j); tmp.push(i,j,48); cruces++;
    }

    links=new Int16Array(tmp); nLinks=tmp.length/3;
    // candidatos a descubrimiento: pares cercanos que aún no se conocen
    cand.length=0; disc.length=0; liveLink=-1;
    outer:
    for(let i=0;i<n;i+=3)for(let j=i+3;j<n;j+=3){
      if(sd[i]!==sd[j]) continue;
      const d=Math.hypot(ux[i]-ux[j],uy[i]-uy[j],uz[i]-uz[j]);
      if(d>maxD&&d<maxD*1.35){ cand.push([i,j]); if(cand.length>=60) break outer; }
    }

    // sprites y halos del tema
    sprS=[glowSprite(THEME.L.glow,3),glowSprite(THEME.R.glow,3)];
    sprM=[glowSprite(THEME.L.glow,5),glowSprite(THEME.R.glow,5)];
    const nucleoLuz=getComputedStyle(document.documentElement).getPropertyValue("--athenea-marfil").trim();
    sprL=[glowSprite(THEME.L.glow,9,nucleoLuz),glowSprite(THEME.R.glow,9,nucleoLuz)];
    haloR=R*1.25;
    halo=[0,1].map(s=>{
      const [c,hg]=makeLayer(haloR*2,haloR*2);
      const grad=hg.createRadialGradient(haloR,haloR,R*0.1,haloR,haloR,haloR);
      grad.addColorStop(0,`rgba(${s===0?THEME.L.a:THEME.R.a},.10)`);
      grad.addColorStop(1,"rgba(0,0,0,0)");
      hg.fillStyle=grad; hg.fillRect(0,0,haloR*2,haloR*2);
      return c;
    });
    // campo energético alrededor del organismo
    const aR=R*1.5, [ac,ag]=makeLayer(aR*2,aR*2);
    const agr=ag.createRadialGradient(aR,aR,R*1.02,aR,aR,aR);
    agr.addColorStop(0,`rgba(${THEME.aura},.06)`);
    agr.addColorStop(0.55,`rgba(${THEME.aura},.024)`);
    agr.addColorStop(1,"rgba(0,0,0,0)");
    ag.fillStyle=agr; ag.beginPath(); ag.arc(aR,aR,aR,0,7); ag.fill();
    aura=ac;

    mw=Math.max(1,Math.ceil(W/6)); mh=Math.max(1,Math.ceil(H/6));
    [mem,mg]=makeLayer(mw,mh);

    paintRoots();
  }

  /* raíces, conectores punteados y anclas: capa estática cacheada */
  function paintRoots(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const [c,rg]=makeLayer(W*dpr,H*dpr);
    rg.setTransform(dpr,0,0,dpr,0,0);
    rg.lineWidth=.8; rg.setLineDash([1,3]);
    const af=H/520;
    const anchorsL=[[68,58*af],[62,166*af],[64,276*af],[76,384*af]];
    const anchorsR=[[W-68,58*af],[W-62,166*af],[W-64,276*af],[W-76,384*af]];
    /* El punto de anclaje se cachea; la LÍNEA ya no. Con la esfera girando, una
       línea dibujada una vez apunta a donde el nodo estaba hace dos minutos.
       Se guarda a qué nodo va cada ancla y el hilo se traza en cada cuadro. */
    anclas=[];
    const connect=(anchors,side,color)=>{
      for(const [ax,ay] of anchors){
        let best=-1,bd=1e9;
        for(let i=0;i<n;i++){
          if(sd[i]!==side) continue;
          const d=Math.hypot(bx[i]-ax,by[i]-ay);
          if(d<bd){bd=d;best=i;}
        }
        if(best>=0){
          anclas.push({ax,ay,i:best,color});
          rg.fillStyle=color; rg.beginPath(); rg.arc(ax,ay,2,0,7); rg.fill();
        }
      }
    };
    connect(anchorsL,-1,`rgba(${THEME.L.a},.5)`);
    connect(anchorsR, 1,`rgba(${THEME.R.a},.5)`);
    rg.setLineDash([]);
    // raíces descendentes: solo cuando la base las pide
    if(NUCLEO_BASE!=="raices"){ rootLine=null; rootsC=c; return; }
    const y0=cy+R*0.78;
    rootLine=[];
    for(let kk=0;kk<9;kk++){
      const t0=(kk-4)/4;
      const grad=rg.createLinearGradient(cx,y0,cx,H);
      grad.addColorStop(0,t0<0?`rgba(${THEME.L.a},.5)`:`rgba(${THEME.R.a},.38)`);
      grad.addColorStop(1,`rgba(${THEME.L.a},.04)`);
      rg.strokeStyle=grad; rg.lineWidth=kk===4?1.8:.9;
      rg.beginPath(); rg.moveTo(cx+t0*4,y0);
      for(let y=y0;y<=H;y+=10){
        const p=(y-y0)/(H-y0);
        const x=cx+t0*4+t0*p*p*34+Math.sin(y/22+kk*1.7)*3.5*p;
        rg.lineTo(x,y);
        if(kk===4) rootLine.push(x,y);
      }
      rg.stroke();
    }
    rootsC=c;
  }

  function update(dt,t){
    const drift=THEME.drift*Mind.mod.drift;
    altBit^=1;
    ang+=dt*Math.PI*2/VUELTA;      // una vuelta cada dos minutos
    proyectar();
    actualizarFugaces(dt,t);                   // bx/by dejan de ser fijos: son la vista de ahora
    for(let rg2=0;rg2<3;rg2++){   // las órbitas cambian de opinión con suavidad infinita
      ringVel[rg2]=lerp(ringVel[rg2],ringVelT[rg2],1-Math.exp(-dt*0.3));
      ringPhase[rg2]+=dt*(0.05+rg2*0.012)*ringVel[rg2];
    }
    for(let i=0;i<n;i++){
      if((i&1)===altBit){
        tx[i]=bx[i]+Noise.n2(bx[i]*0.018+t*0.10,by[i]*0.018+ph[i])*drift;
        ty[i]=by[i]+Noise.n2(by[i]*0.018+t*0.10+31.7,bx[i]*0.018+ph[i])*drift;
      }
      let fx=(tx[i]-px[i])*9, fy=(ty[i]-py[i])*9;
      // ondas de interacción: empuje radial con retorno elástico
      const wv=Interaction.waves;
      for(let w=0;w<wv.length;w+=5){
        if(wv[w]<=0) continue;
        const dx=px[i]-wv[w+1], dy=py[i]-wv[w+2];
        const d=Math.sqrt(dx*dx+dy*dy)||1;
        const band=Math.exp(-((d-wv[w+3])*(d-wv[w+3]))/2400);
        if(band>0.02){
          const f=wv[w]*band/d;
          fx+=dx*f; fy+=dy*f;
        }
      }
      vx[i]=(vx[i]+fx*dt)*Math.exp(-dt*4.5);
      vy[i]=(vy[i]+fy*dt)*Math.exp(-dt*4.5);
      px[i]+=vx[i]*dt;
      py[i]+=vy[i]*dt;
    }
  }

  function draw(t,breath,lum){
    g.clearRect(0,0,W,H);
    dibujarFugaces(t);             // detrás del cúmulo: llega desde el fondo
    // campo energético + halos respirando
    const bs=1+0.02*(breath-0.5)*2;
    g.globalAlpha=0.36+0.24*breath;      // el aura, un paso atrás por el mismo motivo
    g.drawImage(aura,cx-R*1.5*bs,cy-R*1.5*bs,R*3*bs,R*3*bs);
    g.globalAlpha=1;
    for(const s of [0,1]){
      const hx=cx+(s===0?-1:1)*R*0.55;
      g.globalAlpha=0.52+0.18*breath;
      g.drawImage(halo[s],hx-haloR*bs,cy-haloR*bs,haloR*2*bs,haloR*2*bs);
    }
    g.globalAlpha=1;
    // energía organizada: tres órbitas segmentadas, lentísimas, con un centinela cada una
    g.save(); g.translate(cx,cy);
    for(let ring=0;ring<3;ring++){
      const rr=R*(1.16+ring*0.16), tilt=0.82;
      g.globalAlpha=(0.05+0.025*breath)*(ring===1?1.5:1);
      g.strokeStyle=`rgba(${THEME.aura},0.55)`;
      g.lineWidth=0.8;
      g.setLineDash([rr*0.9,rr*1.5]);
      g.lineDashOffset=-ringPhase[ring]*22;
      g.beginPath(); g.ellipse(0,0,rr,rr*tilt,0,0,7); g.stroke();
      const a2=ringPhase[ring];
      g.globalAlpha=0.30+0.25*breath;
      g.drawImage(sprS[ring%2],Math.cos(a2)*rr-3,Math.sin(a2)*rr*tilt-3);
    }
    g.setLineDash([]); g.restore(); g.globalAlpha=1;
    // membrana volumétrica: baja resolución reescalada = volumen suave
    if(Core.quality===2){
      memTick=(memTick+1)%3;
      if(memTick===0){
        mg.clearRect(0,0,mw,mh);
        for(let i=0;i<n;i+=2){
          const s=sd[i]<0?0:1;
          mg.drawImage(sprM[s],px[i]/6-4,py[i]/6-4,8,8);
        }
      }
      // La membrana se baja: con dos lóbulos macizos daba cuerpo, pero sobre un
      // cúmulo con grumos y vacíos los TAPA — que es justo lo que la esfera
      // aporta. Sigue existiendo; deja de mandar.
      g.globalAlpha=0.17+0.11*Mind.r.pulse;
      g.drawImage(mem,0,0,W,H);
      g.globalAlpha=1;
    }
    g.drawImage(rootsC,0,0,W,H);
    // los hilos de las anclas, ahora vivos: siguen a su nodo mientras gira, y
    // se apagan cuando ese nodo pasa por detrás de la esfera
    g.save(); g.setLineDash([1,3]); g.lineWidth=.8;
    for(const a of anclas){
      if(prof[a.i]<0.45) continue;
      g.strokeStyle=a.color;
      g.globalAlpha=0.25+0.75*prof[a.i];
      g.beginPath(); g.moveTo(a.ax,a.ay); g.lineTo(px[a.i],py[a.i]); g.stroke();
    }
    g.restore(); g.globalAlpha=1;
    // enlaces: 4 lotes (lado × cercanía) para evitar un stroke por enlace
    g.lineWidth=.7;
    for(let s=0;s<2;s++){
      const rgb=s===0?THEME.L.a:THEME.R.a;
      for(let bucket=0;bucket<2;bucket++){
        g.strokeStyle=`rgba(${rgb},${((bucket?0.42:0.16)*(0.8+0.4*(Cog.connectivity==null?0.5:Cog.connectivity))*clamp(lum,0.6,1.3)).toFixed(3)})`;
        g.beginPath();
        for(let i=0;i<nLinks;i++){
          const a=links[i*3];
          // los cruces entre hemisferios se pintan aparte, más abajo
          if(sd[a]!==sd[links[i*3+1]]) continue;
          if((sd[a]<0?0:1)!==s) continue;
          if((links[i*3+2]>=22)!==(bucket===1)) continue;
          const b2=links[i*3+1];
          g.moveTo(px[a],py[a]);
          if(bucket===1){ // solo las hebras cercanas se curvan hacia el núcleo: el tejido
            const mx2=(px[a]+px[b2])/2, my2=(py[a]+py[b2])/2;
            g.quadraticCurveTo(mx2+(cx-mx2)*0.10,my2+(cy-my2)*0.10,px[b2],py[b2]);
          } else if(Core.quality===2){
            const fx2=(px[a]+px[b2])/2, fy2=(py[a]+py[b2])/2;
            g.quadraticCurveTo(fx2+(cx-fx2)*0.10,fy2+(cy-fy2)*0.10,px[b2],py[b2]);
          } else g.lineTo(px[b2],py[b2]);
        }
        g.stroke();
      }
    }
    /* LOS CRUCES ENTRE DOMINIOS — §59: «las conexiones entre ambos hemisferios
       son visualmente preciosas». Van aparte porque son lo único de la escena
       que se pinta con los dos colores a la vez, y lo único que late. */
    for(let i=0;i<nLinks;i++){
      const a=links[i*3], b2=links[i*3+1];
      if(sd[a]===sd[b2]) continue;
      const pr=(prof[a]+prof[b2])/2;
      const q=0.45+0.55*Math.pow(0.5+0.5*Math.sin(t*0.8+ph[a]),2);
      const lg=g.createLinearGradient(px[a],py[a],px[b2],py[b2]);
      const al=(0.55*q*pr*clamp(lum,0.6,1.25)).toFixed(3);
      lg.addColorStop(0,`rgba(${THEME.L.a},${al})`);
      lg.addColorStop(0.5,`rgba(255,248,232,${(0.42*q*pr).toFixed(3)})`);
      lg.addColorStop(1,`rgba(${THEME.R.a},${al})`);
      g.strokeStyle=lg; g.lineWidth=0.75+0.45*pr;
      g.beginPath(); g.moveTo(px[a],py[a]); g.lineTo(px[b2],py[b2]); g.stroke();
    }
    g.lineWidth=.7;
    // nodos (sprites, titileo por ruido)
    for(let i=0;i<n;i++){
      const s=sd[i]<0?0:1;
      let tw=0.62+0.38*(0.5+0.5*Noise.n1(t*0.7+ph[i]));
      tw*=0.92+0.08*Mind.r.pulse+audioLvl*0.15;      // pulso cardiaco + sonido ambiente
      tw*=0.93+0.07*Math.sin((Mind.r.breathPh-nd[i]*0.35)*6.283); // la respiración viaja del núcleo hacia afuera
      const dsw=nxr[i]-Mind.r.breathPh;               // meridiano: una luz que recorre y comprende
      if(dsw>-0.18&&dsw<0.18) tw+=0.20*Math.exp(-dsw*dsw*140);
      if(Mind.att.level>0.05){                        // atención: brillo local alrededor del foco
        const adx=px[i]-Mind.att.x, ady=py[i]-Mind.att.y, ad2=adx*adx+ady*ady;
        if(ad2<19600) tw+=Mind.att.level*0.5*(1-ad2/19600);
      }
      // LA PROFUNDIDAD. La cara oculta se ve, pero apagada: es lo único que
      // convierte una nube de puntos en una esfera y no en un círculo.
      g.globalAlpha=clamp(tw*clamp(lum,0.6,1.25)*(0.18+0.82*prof[i]*prof[i]),0,1);
      if(sz[i]===2)      g.drawImage(sprL[s],px[i]-9,py[i]-9);
      else if(sz[i]===1) g.drawImage(sprM[s],px[i]-5,py[i]-5);
      else               g.drawImage(sprS[s],px[i]-3,py[i]-3);
    }
    g.globalAlpha=1;
    // descubrimientos: conexiones nuevas que nacen despacio, porque sí
    for(let i2=0;i2<disc.length;i2++){
      const d=disc[i2], age=t-d.t0;
      const al=age>36?0.40:                                  // integrada: parte del tejido
        Math.min(0.42,age/6*0.42)*(age>6?0.85+0.15*Math.sin(age*0.9):1); // naciendo → estabilizándose
      g.strokeStyle=`rgba(${sd[d.a]<0?THEME.L.a:THEME.R.a},${al.toFixed(3)})`;
      g.lineWidth=.7; g.beginPath();
      const dmx=(px[d.a]+px[d.b])/2, dmy=(py[d.a]+py[d.b])/2;
      g.moveTo(px[d.a],py[d.a]);
      g.quadraticCurveTo(dmx+(cx-dmx)*0.10,dmy+(cy-dmy)*0.10,px[d.b],py[d.b]);
      g.stroke();
      if(t-d.t0<6){
        g.globalAlpha=0.5*Math.sin(Math.min(1,(t-d.t0)/6)*Math.PI);
        g.drawImage(sprM[sd[d.a]<0?0:1],px[d.a]-5,py[d.a]-5);
        g.globalAlpha=1;
      }
    }
    // una conexión despierta: una luz recorre la hebra elegida
    if(liveLink>=0){
      const q=(t-liveT0)/2.8;
      if(q>=1) liveLink=-1;
      else{
        const la=links[liveLink*3], lb=links[liveLink*3+1];
        const e2=q<0.5?2*q*q:1-Math.pow(-2*q+2,2)/2;
        g.globalAlpha=Math.sin(q*Math.PI)*0.9;
        g.drawImage(sprL[sd[la]<0?0:1],lerp(px[la],px[lb],e2)-9,lerp(py[la],py[lb],e2)-9);
        g.globalAlpha=1;
      }
    }
    // pulsos de conocimiento bajando por la raíz central
    if(rootLine&&rootLine.length>4){
      const m=rootLine.length/2;
      const nPulse=Light.activity()>0?2:1;   // el caudal refleja el ingreso real del día
      for(let pIdx=0;pIdx<nPulse;pIdx++){
        const p=((t*0.13)+(pIdx/nPulse))%1;
        const idx=Math.min(m-1,Math.floor(p*m))*2;
        g.globalAlpha=(1-p)*0.9;
        g.drawImage(sprM[pIdx%2],rootLine[idx]-5,rootLine[idx+1]-5);
      }
      g.globalAlpha=1;
    }
  }

  /* ---- LA ESTRELLA FUGAZ -----------------------------------------------
     No es un adorno de cielo: es el mismo relato que los pulsos de la raíz,
     contado al revés. En `raices` el conocimiento BAJA desde el organismo; aquí
     LLEGA de fuera y se integra en el hemisferio que le corresponde — oro si
     entra por práctica, violeta si entra por doctrina.

     Su frecuencia sigue a la actividad real del día, igual que el caudal de la
     raíz: si hoy entraron notas, cruzan más seguido.

     Ley 6: con movimiento reducido no hay ninguna. Un destello que cruza la
     pantalla es lo primero que hay que apagar cuando alguien pide calma. */
  let fugaces=[], colaFugaz=[], ultimaFugaz=-99, ultimoT=0;
  const ESPERA_FUGAZ=1.15;   // segundos mínimos entre dos
  const COLA_MAX=6;

  /* NO HAY TEMPORIZADOR. La estrella no sale cada tantos segundos: sale cuando
     PASA algo. Es un acuse de recibo, no un adorno de cielo.

     Se encola en tres hechos, y solo en esos tres:
       · nace una conexión          → discover()
       · entra información nueva    → Mind.notice("data")
       · la mente comprende algo    → notice("hallazgo") y notice("confirmacion")

     Lo que NO la dispara, y es una decisión: momentLink, que ilumina una hebra
     que YA existía. Eso no es información nueva — es la mente releyéndose. Si
     también lanzara estrella, el cielo estaría lleno y el gesto no significaría
     nada.

     La cola existe por Ley 6. Cuando llegan doce notas de golpe no pueden
     cruzar doce estrellas a la vez: se sirven de una en una, separadas más de
     un segundo, y la cola se corta en seis. Una ráfaga no puede volverse
     tormenta en la pantalla de alguien que está trabajando. */
  function momentFugaz(lado,nodo){
    if(NUCLEO_BASE!=="fugaz"||reduceMotion) return false;
    if(colaFugaz.length>=COLA_MAX) return false;
    colaFugaz.push({lado:(lado===0||lado===-1)?-1:(lado===1?1:(Math.random()<0.5?-1:1)),
                    nodo:(nodo!=null&&nodo>=0&&nodo<n)?nodo:-1});
    return true;
  }

  function lanzarFugaz(pedido,t){
    const lado=pedido.lado;
    // destino: el nodo que provocó el aviso, si lo hay. Que la estrella caiga
    // justo donde nació la conexión es la diferencia entre un acuse y un adorno.
    let dx,dy;
    if(pedido.nodo>=0){ dx=px[pedido.nodo]; dy=py[pedido.nodo]; }
    else { const a=Math.random()*1.5-0.75;
           dx=cx+lado*R*(0.42+Math.random()*0.38); dy=cy+Math.sin(a)*R*0.72; }
    const ox=cx-lado*(W*0.60+Math.random()*W*0.25);
    const oy=-H*0.12-Math.random()*H*0.22;
    fugaces.push({ox,oy,dx,dy,nodo:pedido.nodo,t0:t,dur:1.7+Math.random()*0.9,lado});
  }

  function actualizarFugaces(dt,t){
    ultimoT=t;
    if(NUCLEO_BASE!=="fugaz"||reduceMotion){ colaFugaz.length=0; return; }
    if(colaFugaz.length && t-ultimaFugaz>=ESPERA_FUGAZ){
      lanzarFugaz(colaFugaz.shift(),t); ultimaFugaz=t;
    }
    // el destino persigue a su nodo mientras la esfera gira: si no, la estrella
    // aterriza donde el nodo estaba al salir y no donde está al llegar
    for(const f of fugaces) if(f.nodo>=0){ f.dx=px[f.nodo]; f.dy=py[f.nodo]; }
    if(fugaces.length) fugaces=fugaces.filter(f=>t-f.t0<f.dur+1.3);
  }

  function dibujarFugaces(t){
    if(NUCLEO_BASE!=="fugaz"||!fugaces.length) return;
    const antes=g.lineCap;
    for(const f of fugaces){
      const q=(t-f.t0)/f.dur;
      const rgb=f.lado<0?THEME.L.a:THEME.R.a;
      const s=f.lado<0?0:1;
      if(q<1){
        const e=1-Math.pow(1-q,2.2);                 // llega frenando, no de golpe
        const x=lerp(f.ox,f.dx,e), y=lerp(f.oy,f.dy,e);
        const cola=Math.min(1,q*2.4)*(0.20+0.14*(1-q));   // más larga: se ve de dónde viene
        const e2=Math.max(0,e-cola);
        const qx=lerp(f.ox,f.dx,e2), qy=lerp(f.oy,f.dy,e2);
        // DOS TRAZOS, no uno. Con una sola línea de 1,7 px la estrella se leía
        // como un arañazo en la pantalla y no como un cuerpo que llega. El
        // trazo ancho es el resplandor que arrastra; el fino, el cuerpo.
        const dim=1-q*0.30;
        const halo2=g.createLinearGradient(qx,qy,x,y);
        halo2.addColorStop(0,`rgba(${rgb},0)`);
        halo2.addColorStop(1,`rgba(${rgb},${(0.20*dim).toFixed(3)})`);
        g.strokeStyle=halo2; g.lineWidth=6.5; g.lineCap="round";
        g.beginPath(); g.moveTo(qx,qy); g.lineTo(x,y); g.stroke();

        const gr=g.createLinearGradient(qx,qy,x,y);
        gr.addColorStop(0,`rgba(${rgb},0)`);
        gr.addColorStop(0.62,`rgba(${rgb},${(0.42*dim).toFixed(3)})`);
        gr.addColorStop(1,`rgba(255,248,232,${(0.95*dim).toFixed(3)})`);
        g.strokeStyle=gr; g.lineWidth=2.2;
        g.beginPath(); g.moveTo(qx,qy); g.lineTo(x,y); g.stroke();

        g.globalAlpha=0.95*dim;                  // la cabeza
        g.drawImage(sprL[s],x-9,y-9);
        g.globalAlpha=0.7*dim;
        g.drawImage(sprM[s],x-5,y-5);
        g.globalAlpha=1;
      } else {
        // el destello de llegada: la nota entra en el cúmulo y se queda
        const w=(t-f.t0-f.dur)/1.3;
        g.globalAlpha=Math.sin(Math.min(1,w)*Math.PI)*0.7;
        g.drawImage(sprL[s],f.dx-9,f.dy-9);
        g.globalAlpha=1;
      }
    }
    g.lineCap=antes;
  }

  function momentLink(tNow,sidePref){
    if(nLinks<=0) return;
    mlSeq=(mlSeq+0.6180339887)%1;
    let idx=Math.floor(mlSeq*nLinks)%nLinks;
    if(sidePref===0||sidePref===1){
      for(let tries=0;tries<60;tries++){
        if((sd[links[idx*3]]<0?0:1)===sidePref) break;
        idx=(idx+1)%nLinks;
      }
    }
    liveLink=idx; liveT0=tNow;
  }
  function momentOrbit(){ orbSeq=(orbSeq+0.6180339887)%1;
    ringVelT[Math.floor(orbSeq*3)%3]*=-1; }
  function discover(tNow,sidePref){
    if(!cand.length||disc.length>=Math.round(4+16*Cog.novelty)) return false;
    dSeq=(dSeq+0.6180339887)%1;
    let idx=Math.floor(dSeq*cand.length)%cand.length;
    if(sidePref===0||sidePref===1){
      for(let tries=0;tries<cand.length;tries++){
        if((sd[cand[idx][0]]<0?0:1)===sidePref) break;
        idx=(idx+1)%cand.length;
      }
    }
    const c=cand[idx];
    if(disc.some(d=>d.a===c[0]&&d.b===c[1])) return false;
    disc.push({a:c[0],b:c[1],t0:tNow});
    momentFugaz(sd[c[0]]<0?0:1, c[0]);   // nace una conexión: llega su estrella
    return true;
  }
  return {rebuild,update,draw,momentLink,momentOrbit,momentFugaz,discover,
    get cx(){return cx}, get cy(){return cy}, get R(){return R},
    get rootLine(){return rootLine}};
})();

/* ---------- Scene: el valle — base cacheada + luz viva ---------- */
/* EL PAISAJE DERIVA DE LA IDENTIDAD.
   El cielo y las cuatro crestas del valle eran ocho tonos escritos a mano. No
   son marca —nadie los va a poner en una tarjeta— pero sí son SUPERFICIE DE
   MARCA, y una superficie que no deriva de la identidad se queda atrás el día
   que la identidad cambia. Ahora se componen del cosmos y del espacio.

   Se mezcla en JS y no con color-mix porque canvas necesita un color concreto:
   un degradado no acepta una custom property sin resolver. */
const TIERRA = (() => {
  const cs = getComputedStyle(document.documentElement);
  const hex = h => { const s=(h||"").trim().replace("#","");
    const b=parseInt(s.length===3?s.split("").map(c=>c+c).join(""):s,16);
    return [b>>16&255, b>>8&255, b&255]; };
  /* Sin valores de reserva, por el mismo motivo de siempre: una copia del
     token miente el día que la identidad cambia. */
  const cosmos  = hex(cs.getPropertyValue("--athenea-cosmos"));
  const espacio = hex(cs.getPropertyValue("--athenea-espacio"));
  const doctrina= hex(cs.getPropertyValue("--athenea-doctrina"));
  // acepta lista o texto en los dos lados: cielo2 se compone de una mezcla ya
  // hecha, y la primera versión le pasaba una cadena a algo que esperaba lista
  const lista = x => Array.isArray(x) ? x : hex(x);
  const mez = (a,b,p) => { const A=lista(a), B=lista(b);
    return "#" + A.map((v,i)=>Math.round(v*(1-p)+B[i]*p)
                    .toString(16).padStart(2,"0")).join(""); };
  return {
    // el cielo: del cosmos al espacio y de vuelta, con un rubor de doctrina
    cielo1: mez(cosmos, espacio, 0.55),
    cielo2: mez(mez(cosmos, espacio, 0.40), doctrina, 0.16),
    cielo3: mez(cosmos, espacio, 0.34),
    cielo4: mez(cosmos, espacio, 0.00),
    // las cuatro crestas: cada una un paso más cerca del cosmos
    cresta: [mez(cosmos, doctrina, 0.11), mez(cosmos, doctrina, 0.07),
             mez(cosmos, doctrina, 0.04), mez(cosmos, doctrina, 0.015)],
    fondo:  mez(cosmos, [0,0,0], 0.45),
  };
})();

const Scene={
  g:null,W:0,H:0,base:null,path:[],horizon:0,fig:null,
  sunSpr:null,cometSpr:null,
  paint(){
    const cv=document.getElementById("scene");
    [this.g,this.W,this.H]=setupCanvas(cv,1.5);
    const W=this.W,H=this.H;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const [c,g]=makeLayer(W*dpr,H*dpr);
    g.setTransform(dpr,0,0,dpr,0,0);
    const rnd=mulberry32(11);
    const horizon=this.horizon=H*0.30;
    const sky=g.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,"rgba(5,6,14,0)");
    sky.addColorStop(.22,TIERRA.cielo1);
    sky.addColorStop(.34,TIERRA.cielo2);
    sky.addColorStop(.42,TIERRA.cielo3);
    sky.addColorStop(1,TIERRA.cielo4);
    g.fillStyle=sky; g.fillRect(0,0,W,H);
    const sun=g.createRadialGradient(W/2,horizon,4,W/2,horizon,W*0.55);
    sun.addColorStop(0,"rgba(255,190,90,.85)");
    sun.addColorStop(.18,"rgba(255,150,50,.35)");
    sun.addColorStop(.5,"rgba(200,90,40,.10)");
    sun.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=sun; g.fillRect(0,0,W,H);
    g.fillStyle="rgba(30,20,35,.55)";
    for(let i=0;i<8;i++){
      const y=horizon-14-rnd()*46, w=40+rnd()*120;
      g.beginPath(); g.ellipse(rnd()*W,y,w,3+rnd()*4,0,0,7); g.fill();
    }
    const layers=[
      {y:horizon+2, amp:26, col:TIERRA.cresta[0], jag:.9},
      {y:horizon+30, amp:40, col:TIERRA.cresta[1], jag:1.3},
      {y:horizon+72, amp:58, col:TIERRA.cresta[2], jag:1.6},
      {y:horizon+130,amp:80, col:TIERRA.cresta[3], jag:2.0},
    ];
    for(const L of layers){
      g.fillStyle=L.col; g.beginPath(); g.moveTo(0,H);
      let y=L.y+(rnd()-0.5)*L.amp;
      for(let x=0;x<=W;x+=10){
        y+=(rnd()-0.5)*L.amp*0.5*L.jag;
        y=Math.max(L.y-L.amp,Math.min(L.y+L.amp*0.6,y));
        g.lineTo(x,y-Math.abs(x-W/2)/W*(-18));
      }
      g.lineTo(W,H); g.closePath(); g.fill();
    }
    // sendero
    const path=this.path=[]; const topY=horizon+6, bottomY=H-92;
    const drop=Math.max(60,bottomY-topY);
    const steps=Math.max(18,Math.round(drop/8.2));
    const ampMax=Math.min(78,drop*0.16);
    const phase=rnd()*6;
    for(let t=0;t<=steps;t++){
      const p=t/steps;
      const py2=topY+drop*Math.pow(p,1.25);
      const amp=ampMax*p*(1-Math.max(0,(p-0.78)/0.22)*0.92);
      path.push([W/2+Math.sin(t*0.55+phase)*amp,py2]);
    }
    path.push([W/2,bottomY+8]);
    for(let pass=0;pass<3;pass++){
      g.beginPath();
      path.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));
      g.strokeStyle=["rgba(255,150,40,.12)","rgba(255,180,70,.35)","rgba(255,220,140,.9)"][pass];
      g.lineWidth=[10,4.5,1.6][pass];
      g.lineCap="round"; g.lineJoin="round";
      g.shadowColor=getComputedStyle(document.documentElement).getPropertyValue("--gold-hi").trim(); g.shadowBlur=pass===2?10:0;
      g.stroke();
    }
    g.shadowBlur=0;
    for(let i=0;i<16;i++){
      const [x,y]=path[Math.floor(rnd()*path.length)];
      g.fillStyle=`rgba(255,210,120,${.3+rnd()*.5})`;
      g.beginPath(); g.arc(x+(rnd()-.5)*16,y+(rnd()-.5)*8,rnd()*1.2+.3,0,7); g.fill();
    }
    const fade=g.createLinearGradient(0,H-90,0,H);
    fade.addColorStop(0,"rgba(5,6,14,0)"); fade.addColorStop(1,"rgba(5,6,14,1)");
    g.fillStyle=fade; g.fillRect(0,H-90,W,90);
    // roca y figura
    const fx=W/2, fy=H-46; this.fig={x:fx,y:fy};
    g.fillStyle=TIERRA.fondo;
    g.beginPath();
    g.moveTo(fx-22,fy+22); g.lineTo(fx-16,fy+9); g.lineTo(fx-5,fy+6);
    g.lineTo(fx+9,fy+8); g.lineTo(fx+19,fy+13); g.lineTo(fx+23,fy+22); g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(fx-7,fy+8); g.quadraticCurveTo(fx-9,fy-12,fx-3.5,fy-21);
    g.lineTo(fx+3.5,fy-21); g.quadraticCurveTo(fx+9,fy-10,fx+8,fy+8); g.closePath(); g.fill();
    g.beginPath(); g.arc(fx,fy-26.5,3.8,0,7); g.fill();
    g.strokeStyle="rgba(255,180,80,.55)"; g.lineWidth=1;
    g.beginPath(); g.moveTo(fx-3.5,fy-21); g.quadraticCurveTo(fx-9,fy-12,fx-7,fy+8); g.stroke();
    g.beginPath(); g.arc(fx,fy-26.5,3.8,Math.PI*0.7,Math.PI*1.45); g.stroke();
    this.base=c;
    this.sunSpr=glowSprite("rgba(255,170,60,.55)",70,"rgba(255,220,150,.55)");
    this.cometSpr=glowSprite("rgba(255,200,100,.95)",6);
  },
  draw(dt,t,breath){
    const g=this.g;
    g.clearRect(0,0,this.W,this.H);
    g.drawImage(this.base,0,0,this.W,this.H);
    // el amanecer respira
    g.globalAlpha=0.10+0.14*breath;
    g.drawImage(this.sunSpr,this.W/2-70,this.horizon-70);
    // caminantes de luz descendiendo el sendero
    const m=this.path.length-1;
    const nW=Cog.flow>0?2:1;   // si hoy fluyó conocimiento, baja un caminante más
    for(let i=0;i<nW;i++){
      let p=(((t+4*Noise.n1(t*0.05+i*3))/18)+(i/2))%1; if(p<0)p+=1;
      const idx=p*m, i0=Math.floor(idx), fr=idx-i0;
      const a=this.path[i0], b=this.path[Math.min(m,i0+1)];
      g.globalAlpha=0.5+0.4*Math.sin(p*Math.PI);
      g.drawImage(this.cometSpr,lerp(a[0],b[0],fr)-6,lerp(a[1],b[1],fr)-6);
    }
    // destello en la mano de la figura
    if(this.fig){
      g.globalAlpha=0.5+0.5*(0.5+0.5*Noise.n1(t*1.3));
      g.drawImage(this.cometSpr,this.fig.x+9.5-6,this.fig.y-4-6);
    }
    g.globalAlpha=1;
  },
};

/* ---------- Particles: flujo de conocimiento (pool, sin GC) ---------- */
const Particles=(()=>{
  const MAX=200;
  const P=[]; const free=[];
  for(let i=0;i<MAX;i++){
    P.push({on:false,mode:0,x:0,y:0,vx:0,vy:0,p:0,sp:0,
            x0:0,y0:0,cxq:0,cyq:0,x1:0,y1:0,side:0,size:1,seed:i*0.6180339887});
    free.push(i);
  }
  let g=null,W=0,H=0, spr=[null,null], acc=0, seq=0.17;
  let emitters=[];       // {x,y,w,side} — anclas de los callouts, peso = notas reales
  function retint(){ spr=[glowSprite(THEME.L.glow,4),glowSprite(THEME.R.glow,4)]; }
  function bind(){
    const cv=document.getElementById("fx");
    [g,W,H]=setupCanvas(cv,1);
    retint();
    syncEmitters();
  }
  function syncEmitters(counts){
    emitters.length=0;
    const fxEl=document.getElementById("fx");
    const rect=fxEl.getBoundingClientRect();
    const sc=rect.width/(fxEl.offsetWidth||rect.width)||1; // compensa scale() del modo pantalla
    const order=DATA.areas.filter(a=>a.side==="L").concat(DATA.areas.filter(a=>a.side==="R"));
    document.querySelectorAll(".callout .ico").forEach((el,i)=>{
      const a=order[i]; if(!a) return;
      const r=el.getBoundingClientRect();
      const w=counts?(counts[a.nombre]||0):a.notas;
      const hist=DATA.historial||[];
      let dormida=false;   // sin cambios entre los dos últimos censos reales → pierde fuerza despacio
      if(hist.length>=2&&hist[hist.length-1].porArea&&hist[hist.length-2].porArea)
        dormida=(hist[hist.length-1].porArea[a.nombre]||0)===(hist[hist.length-2].porArea[a.nombre]||0)&&w>0;
      el.parentElement.classList.toggle("quiet", w===0);   // lo abandonado calla, no desaparece
      el.parentElement.classList.toggle("dormida", dormida);
      emitters.push({x:(r.left-rect.left+r.width/2)/sc,y:(r.top-rect.top+r.height/2)/sc,
                     w:w,side:a.side==="L"?0:1});
    });
  }
  function next(){ seq=(seq+0.6180339887)%1; return seq; } // secuencia áurea determinista
  function alloc(){ return free.length?free.pop():-1; }
  function spawnFlux(){
    if(!emitters.length) return;
    let total=0; for(const e of emitters) total+=e.w;
    if(total<=0) return;   // sin conocimiento no hay circulación
    let pick=next()*total, em=emitters[0];
    for(const e of emitters){ pick-=e.w; if(pick<=0){em=e;break;} }
    const i=alloc(); if(i<0) return;
    const o=P[i]; o.on=true; o.mode=0; o.side=em.side;
    o.x0=em.x+(next()-0.5)*14; o.y0=em.y+(next()-0.5)*14;
    o.x1=Organism.cx; o.y1=Organism.cy+document.querySelector(".hero").offsetTop;
    o.cxq=(o.x0+o.x1)/2+(next()-0.5)*90;
    o.cyq=(o.y0+o.y1)/2+(next()-0.5)*60;
    o.p=0; o.sp=0.16+next()*0.12; o.size=0.7+ (em.w>50?0.6:em.w/80);
  }
  function burst(x,y,hueSide){
    const count=14, base=next()*6.283;
    for(let k2=0;k2<count;k2++){
      const i=alloc(); if(i<0) return;
      const o=P[i]; o.on=true; o.mode=1;
      const ang=base+(k2/count)*6.283, v=40+110*(0.5+0.5*Noise.n1(o.seed+k2));
      o.x=x; o.y=y; o.vx=Math.cos(ang)*v; o.vy=Math.sin(ang)*v-30;
      o.p=1; o.side=hueSide; o.size=0.5+ (k2%3)*0.4;
    }
  }
  function update(dt,t){
    if(!reduceMotion){
      acc+=dt*THEME.flux*Mind.mod.flux*(1.3+2.2*Light.activity())*(Core.quality===0?0:(Core.slow?0.5:1));
      while(acc>1){ acc-=1; spawnFlux(); }
    }
    for(let i=0;i<MAX;i++){
      const o=P[i]; if(!o.on) continue;
      if(o.mode===0){ // flujo hacia el núcleo por curva cuadrática
        o.p+=o.sp*dt*(0.7+0.6*o.p)*Mind.mod.speed;
        if(o.p>=1){ o.on=false; free.push(i); Light.boost(0.015); continue; }
        const q=1-o.p;
        o.x=q*q*o.x0+2*q*o.p*o.cxq+o.p*o.p*o.x1 + Noise.n1(t+o.seed)*3;
        o.y=q*q*o.y0+2*q*o.p*o.cyq+o.p*o.p*o.y1 + Noise.n1(t+o.seed+9)*3;
      }else{ // chispa con física de resorte amortiguado
        o.p-=dt*1.15;
        if(o.p<=0){ o.on=false; free.push(i); continue; }
        o.vy+=55*dt; o.vx*=Math.exp(-dt*1.4); o.vy*=Math.exp(-dt*1.1);
        // atracción suave al puntero mientras está presionado
        if(Interaction.down){
          o.vx+=(Interaction.px-o.x)*dt*2.2;
          o.vy+=(Interaction.py-o.y)*dt*2.2;
        }
        o.x+=o.vx*dt; o.y+=o.vy*dt;
      }
    }
  }
  function draw(){
    if(!g) return;
    g.clearRect(0,0,W,H);
    g.globalCompositeOperation="lighter";
    for(let i=0;i<MAX;i++){
      const o=P[i]; if(!o.on) continue;
      const a=o.mode===0?(0.35+0.6*Math.sin(o.p*Math.PI)):clamp(o.p,0,1);
      g.globalAlpha=a;
      const s=8*o.size;
      g.drawImage(spr[o.side],o.x-s/2,o.y-s/2,s,s);
    }
    g.globalAlpha=1;
    g.globalCompositeOperation="source-over";
  }
  return {bind,retint,update,draw,burst,syncEmitters,peekEmitters:()=>emitters};
})();

/* ---------- Interaction: el tacto como fenómeno físico ---------- */
const Interaction={
  // ondas: [amp,x,y,r,v] × 6 (aplanado, sin objetos)
  waves:new Float32Array(30),
  down:false,px:0,py:0,
  init(){
    const phone=document.querySelector(".phone");
    const fx=document.getElementById("fx");
    phone.addEventListener("pointerdown",ev=>{
      const r=fx.getBoundingClientRect();
      const sc=r.width/(fx.offsetWidth||r.width)||1;
      const x=(ev.clientX-r.left)/sc, y=(ev.clientY-r.top)/sc;
      this.down=true; this.px=x; this.py=y;
      const hero=document.querySelector(".hero");
      Mind.notice("touch",x,y-(hero?hero.offsetTop:0));
      this.wave(x,y);
      Particles.burst(x,y,x<r.width/2?0:1);
      Light.boost(0.3);
      try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
    },{passive:true});
    phone.addEventListener("pointermove",ev=>{
      if(!this.down) return;
      const r=fx.getBoundingClientRect();
      const sc=r.width/(fx.offsetWidth||r.width)||1;
      this.px=(ev.clientX-r.left)/sc; this.py=(ev.clientY-r.top)/sc;
    },{passive:true});
    addEventListener("pointerup",()=>{this.down=false;},{passive:true});
    addEventListener("pointercancel",()=>{this.down=false;},{passive:true});
  },
  wave(x,y,scale){
    const w=this.waves;
    let slot=0,min=1e9;
    for(let i=0;i<30;i+=5){ if(w[i]<min){min=w[i];slot=i;} }
    const hero=document.querySelector(".hero");
    const st=1.15-0.3*Mind.vitals.memory;   // la memoria estabiliza: menos sacudida
    w[slot]=520*THEME.wave*(scale||1)*st; w[slot+1]=x; w[slot+2]=y-(hero?hero.offsetTop:0);
    w[slot+3]=0; w[slot+4]=300;
  },
  softWave(x,y,scale){ this.wave(x,y,scale||0.35); },
  turbulence(){ let s2=0; for(let i=0;i<30;i+=5) s2+=this.waves[i]; return s2/1000; },
  update(dt){
    const w=this.waves;
    for(let i=0;i<30;i+=5){
      if(w[i]<=0) continue;
      w[i+3]+=w[i+4]*dt;
      w[i]*=Math.exp(-dt*2.4);
      if(w[i]<3) w[i]=0;
    }
  },
};

    const h=hip[0]; revActual=h;
