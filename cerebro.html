/* ═══════════════ sincronización en vivo con Google Drive ═══════════════ */
const LIVE = { server:"Google Drive", tool:"search_files", maxPages:8,
               cache:{staleTime:240000, gcTime:3600000} };
const syncEl = document.getElementById("sync"), syncTxt = document.getElementById("sync-txt");
function setSync(txt, cls){ syncTxt.textContent = txt; syncEl.className = "sync" + (cls?" "+cls:""); }

function applyLive(files, storedAt, truncated){
  const now = new Date();
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const week = now.getTime() - 7*86400000;
  let creadasHoy=0, modHoy=0, semana=0;
  for(const f of files){
    const c = Date.parse(f.createdTime||0), m = Date.parse(f.modifiedTime||0);
    if(c >= midnight) creadasHoy++;
    else if(m >= midnight) modHoy++;
    if(c >= week) semana++;
  }
  // Actividad de hoy
  const actRows = document.querySelectorAll("#card-act .row");
  const setRow = (row, label, val) => {
    if(!row) return;
    row.querySelector("span:first-child").lastChild.textContent = label;
    row.querySelector(".val").textContent = val;
  };
  setRow(actRows[0], "Notas creadas hoy", String(creadasHoy));
  setRow(actRows[1], "Notas modificadas hoy", String(modHoy));
  setRow(actRows[2], "Notas esta semana", String(semana));
  // Resumen general — notas totales reales
  const resVal = document.querySelector("#card-res .row .val");
  if(resVal) resVal.textContent = fmt(files.length) + (truncated ? "+" : "");
  senseKnowledge(files.length, creadasHoy, modHoy, semana);   // el gemelo se recalibra con lo real
  // Progreso del día
  document.getElementById("f-plus").textContent = "+" + (creadasHoy + modHoy);
  const t = new Date(storedAt || Date.now());
  const hh = String(t.getHours()).padStart(2,"0"), mm = String(t.getMinutes()).padStart(2,"0");
  setSync(`Drive · ${fmt(files.length)}${truncated?"+":""} notas · ${hh}:${mm}`, "");
  // onda de datos: el organismo siente entrar el conocimiento nuevo
  if((creadasHoy+modHoy) > 0 && typeof Interaction !== "undefined" && !reduceMotion){
    const fxEl = document.getElementById("fx");
    const hero = document.querySelector(".hero");
    Interaction.wave(fxEl.offsetWidth/2, (hero?hero.offsetTop:0) + Organism.cy);
    Light.boost(0.5);
    Mind.notice("data", creadasHoy >= 20);   // día grande → celebración
  }
}

async function pagedSearch(mcp, query, maxPages){
  const items = []; let token = null, storedAt = null, retried = false;
  for(let page=0; page<maxPages; page++){
    const input = { query, pageSize:100, excludeContentSnippets:true };
    if(token) input.pageToken = token;
    let r;
    try{ r = await mcp.callTool(LIVE.server, LIVE.tool, input, {cache:LIVE.cache}); }
    catch(e){
      if(e && e.retryable && !retried){
        retried = true;
        await new Promise(s=>setTimeout(s, (e.retryAfterMs||900) + Math.random()*600));
        r = await mcp.callTool(LIVE.server, LIVE.tool, input, {cache:LIVE.cache});
      } else throw e;
    }
    const p = (r && typeof r.payload === "object" && r.payload) || {};
    if(Array.isArray(p.files)) items.push(...p.files);
    if(r.cache && r.cache.storedAt) storedAt = Math.max(storedAt||0, r.cache.storedAt);
    token = p.nextPageToken;
    if(!token || !(p.files && p.files.length)){ token = null; break; }
  }
  return { items, storedAt, truncated: !!token };
}

/* clasificación por área: se recorre la cadena de carpetas de cada nota
   (de la más cercana a la raíz) y gana la primera que coincida */
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const AREA_RX = [
  { k:"Derecho Internacional",  rx:/internacional|\boit\b|cidh|interamerican|convenio/ },
  { k:"Derecho Laboral",        rx:/laboral|sindic|servir|negociacion colectiva|seguridad y salud|despido|reposicion|remuner/ },
  { k:"Derecho Constitucional", rx:/constitucional|amparo|habeas|debido proceso|\btc\b|pa-tc/ },
  { k:"Derecho Penal",          rx:/penal|incautacion|delito|\bjip\b|tutela de derechos/ },
  { k:"Derecho Administrativo", rx:/administrativ|contrataciones|sancionador|licencias|rendicion/ },
  { k:"Derecho Procesal",       rx:/procesal|contencioso|arbitra|proceso civil|casacion|nulidad en el proceso/ },
  { k:"Derecho Civil",          rx:/civil|familia|consumidor|nulidad del acto/ },
];
/* EL COLOR DE CADA ÁREA EN LA RUEDA.
   Aquí había ocho matices escritos a mano —ámbar, violeta, azul, verde, cian,
   gris azulado— y eso es exactamente la «serie N» que la Colección VIII
   prohíbe: una escala categórica de colores arbitrarios para lo que en ATHENEA
   solo tiene DOS familias.

   Ahora cada área toma un escalón de la rampa de SU familia: las de práctica
   del oro (--dato-1..4), las de doctrina del violeta (--doctrina-1..4), y el
   escalón lo da su tamaño —la más grande, el más fuerte—. Cero tonos nuevos, y
   la rueda pasa a decir lo mismo que el resto del sistema: dónde hay acción y
   dónde hay criterio. */
function colorDeArea(nombre, rango){
  const lado = (DATA.areas || []).find(a => a.nombre === nombre);
  const fam = lado && lado.side === "R" ? "doctrina" : "dato";
  const paso = 4 - Math.min(3, rango);          // 0 → el más fuerte
  return getComputedStyle(document.documentElement)
           .getPropertyValue(`--${fam}-${paso}`).trim() || "currentColor";
}
function classify(file, folderMap){
  let pid = file.parentId, hops = 0;
  while(pid && folderMap.has(pid) && hops++ < 12){
    const f = folderMap.get(pid);
    const n = norm(f.title);
    for(const a of AREA_RX) if(a.rx.test(n)) return a.k;
    pid = f.parentId;
  }
  const t = norm(file.title);
  for(const a of AREA_RX) if(a.rx.test(t)) return a.k;
  return "Otras Áreas";
}

function applyAreas(files, folders){
  const folderMap = new Map(folders.map(f=>[f.id, f]));
  const counts = {};
  for(const f of files){
    const k = classify(f, folderMap);
    counts[k] = (counts[k]||0) + 1;
  }
  // callouts del cerebro: notas reales por área (en orden de render: izquierda, luego derecha)
  const order = DATA.areas.filter(a=>a.side==="L").concat(DATA.areas.filter(a=>a.side==="R"));
  document.querySelectorAll(".callout").forEach((el,i)=>{
    const a = order[i]; if(!a) return;
    const n1 = el.querySelector(".n1");
    const n = counts[a.nombre]||0;
    if(n1) n1.innerHTML = `<b>${fmt(n)}</b> ${n===1?"nota":"notas"}`;
  });
  // hemisferios: densidad proporcional a las notas de cada lado
  const sideOf = {}; DATA.areas.forEach(a=>sideOf[a.nombre]=a.side);
  let L=0, R=0;
  for(const [k,v] of Object.entries(counts)) (sideOf[k]==="L" ? (L+=v) : (R+=v));
  if(L+R > 0){ brainW = { L: L/(L+R), R: R/(L+R) }; drawBrain(); }
  Particles.syncEmitters(counts); // el flujo de conocimiento sigue a los datos reales
  // dona con porcentajes reales (resto mayor para que sume 100)
  const total = files.length || 1;
  // el rango es POR FAMILIA: dos áreas de familias distintas pueden compartir
  // escalón sin confundirse, porque el tono ya las separa
  const rango = {L:0, R:0};
  let list = Object.entries(counts)
    .sort((x,y)=>y[1]-x[1])
    .map(([k,v])=>{
      const a = (DATA.areas||[]).find(x=>x.nombre===k);
      const lado = a && a.side === "R" ? "R" : "L";
      return { k:k.replace("Derecho ",""), full:k, v,
               raw:100*v/total, pct:Math.floor(100*v/total),
               c:colorDeArea(k, rango[lado]++) };
    });
  let left = 100 - list.reduce((s,d)=>s+d.pct,0);
  list.slice().sort((x,y)=>(y.raw-y.pct)-(x.raw-x.pct)).forEach(d=>{ if(left>0){ d.pct++; left--; } });
  renderDonut(list.filter(d=>d.pct>0));
  // resumen: áreas con al menos una nota
  const resVals = document.querySelectorAll("#card-res .row .val");
  if(resVals[4]) resVals[4].textContent = String(Object.keys(counts).length);
  senseKnowledge(null,null,null,null,counts);
}

async function syncDrive(force){
  const mcp = window.claude && window.claude.mcp;
  if(!mcp) return; // vista sin conectores: se queda con los datos de referencia
  setSync("Sincronizando con Drive…", "busy");
  try{
    if(force && mcp.invalidate) await mcp.invalidate(LIVE.server, LIVE.tool).catch(()=>{});
    const notas = await pagedSearch(mcp, "mimeType = 'text/markdown'", LIVE.maxPages);
    applyLive(notas.items, notas.storedAt, notas.truncated);
    const carpetas = await pagedSearch(mcp, "mimeType = 'application/vnd.google-apps.folder'", 4);
    applyAreas(notas.items, carpetas.items);
  }catch(e){
    const code = e && e.code;
    if(code === "needs_reauth")
      setSync("Reconecta Google Drive en claude.ai › Ajustes › Conectores", "err");
    else if(code === "server_not_connected")
      setSync("Añade Google Drive en claude.ai › Ajustes › Conectores", "err");
    else if(code === "selection_required")
      setSync("Elige tu conector de Google Drive en claude.ai", "err");
    else if(code === "not_granted" || code === "capability_disabled" || code === "capability_removed")
      setSync("Sincronizado con Obsidian", "");
    else if(code === "tool_error")
      setSync("Drive respondió con un error · datos de referencia", "err");
    else
      setSync("Sin conexión con Drive · datos de referencia", "err");
  }
}
